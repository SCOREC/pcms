[build-system]
requires = ["scikit-build-core>=0.10", "pybind11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "pcms"
dynamic = ["version"]

# The version comes from git describe, using the same scheme as the CMake build
# (cmake/PcmsVersion.cmake), which takes this version when built by pip.
[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.scikit-build.cmake.define]
PCMS_ENABLE_Python = true

[tool.pytest.ini_options]
testpaths = ["test/python"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"
